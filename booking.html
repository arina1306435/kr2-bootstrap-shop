<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись — Fluffy&Clean</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/custom.css">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark" style="background-color: var(--olive);">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">Fluffy&Clean</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
          
          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              Услуги
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="catalog.html">Все услуги</a></li>
              <li><hr class="dropdown-divider"></li>
              <li><a class="dropdown-item" href="catalog.html">Стрижка и груминг</a></li>
              <li><a class="dropdown-item" href="catalog.html">SPA-уход</a></li>
            </ul>
          </li>
          
          <li class="nav-item"><a class="nav-link" href="about.html">О нас</a></li>
          <li class="nav-item"><a class="nav-link" href="booking.html">Запись</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card p-4">
          <h1 class="text-center mb-4">Онлайн-запись</h1>
          

          <form>
            <div class="mb-3">
              <label for="clientName" class="form-label">Ваше имя</label>
              <input type="text" class="form-control" id="clientName" placeholder="Анна" required>
            </div>

            <div class="mb-3">
              <label for="clientPhone" class="form-label">Телефон</label>

              <div class="input-group">
                <span class="input-group-text">+7</span>
                <input type="tel" class="form-control" id="clientPhone" placeholder="900 000-00-00" required>
              </div>
            </div>

            <div class="mb-3">
              <label for="petType" class="form-label">Ваш питомец</label>

              <select class="form-select" id="petType">
                <option selected>Выберите...</option>
                <option value="dog">Собака</option>
                <option value="cat">Кошка</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="serviceType" class="form-label">Услуга и дизайн</label>
              <select class="form-select" id="serviceType">
                <option selected>Выберите услугу...</option>
                <option value="1">Комплексный груминг (классика)</option>
                <option value="2">Креативная стрижка (с покраской)</option>
                <option value="3">SPA-уход</option>
              </select>
            </div>

            <div class="mb-3">
              <label class="form-label d-block">Дополнительные опции:</label>

              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="optTeeth">
                <label class="form-check-label" for="optTeeth">Чистка зубов</label>
              </div>
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="optAroma">
                <label class="form-check-label" for="optAroma">Ароматерапия</label>
              </div>
            </div>

            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="agree" required>
              <label class="form-check-label" for="agree">Согласен на обработку данных</label>
            </div>

            <button type="button" class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#successModal">
              Отправить заявку
            </button>
          </form>
        </div>
      </div>
    </div>
  </main>


  <div class="modal fade" id="successModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header text-white" style="background-color: var(--olive);">
          <h5 class="modal-title">Успешно!</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Закрыть"></button>
        </div>
        <div class="modal-body text-center py-4">
          <h3 class="mb-3">Спасибо!</h3>
          <p class="mb-0">Ваша заявка принята. Мы свяжемся с вами в ближайшее время для подтверждения записи.</p>
        </div>
        <div class="modal-footer justify-content-center">
          <button type="button" class="btn btn-outline-primary" data-bs-dismiss="modal">Закрыть</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="bg-dark text-white text-center py-4 mt-auto">
    <div class="container"><p class="mb-0">&copy; 2026 Fluffy&Clean.</p></div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
